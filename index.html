<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zápis o utkání</title>
  <meta name="description" content="Elektronický zápis o konaném šachovém utkání s načtením soupisek z chess-results.">
  <meta name="theme-color" content="#1f3a5f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand-wrap">
      <div class="brand"><span class="logo" aria-hidden="true">♞</span> Zápis o utkání</div>
      <div class="data-line">
        <span class="data-status" id="dataStatus"></span>
        <button id="btnRefresh" class="icon-btn" type="button" title="Obnovit soupisky" aria-label="Obnovit soupisky">↻</button>
      </div>
    </div>
    <div class="top-right">
      <button id="btnArchive" class="btn small ghost" type="button">Archiv</button>
      <button id="btnNew" class="btn small ghost" type="button">+ Nový zápis</button>
    </div>
  </header>
  <div id="overlay" class="overlay" hidden></div>
  <nav class="steps" id="steps" aria-label="Kroky zápisu"></nav>
  <main id="view" tabindex="-1"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Aplikace potřebuje zapnutý JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
