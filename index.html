<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zápis o utkání</title>
  <meta name="description" content="Elektronický zápis o konaném šachovém utkání s načtením soupisek z chess-results.">
  <meta name="theme-color" content="#1f3a5f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand-wrap">
      <div class="brand"><span class="logo" aria-hidden="true">♞</span> Zápis o utkání</div>
      <div class="data-line">
        <span class="data-status" id="dataStatus"></span>
        <button id="btnRefresh" class="icon-btn" type="button" title="Obnovit soupisky" aria-label="Obnovit soupisky">↻</button>
      </div>
    </div>
    <div class="top-right">
      <details class="ui-menu" id="uiMenu">
        <summary title="Zobrazení"><span class="ui-ico" aria-hidden="true"></span><span class="ui-label"></span></summary>
        <div class="ui-pop" role="menu">
          <div class="ui-head">Zobrazení</div>
          <button type="button" data-ui="auto" role="menuitemradio">Automaticky</button>
          <button type="button" data-ui="desktop" role="menuitemradio">🖥 Počítač</button>
          <button type="button" data-ui="touch" role="menuitemradio">📱 Tablet a mobil</button>
        </div>
      </details>
      <button id="btnArchive" class="btn small ghost" type="button">Archiv</button>
      <button id="btnNew" class="btn small ghost" type="button" aria-label="Nový zápis">+ Nový<span class="long"> zápis</span></button>
    </div>
  </header>
  <div id="overlay" class="overlay" hidden></div>
  <nav class="steps" id="steps" aria-label="Kroky zápisu"></nav>
  <main id="view" tabindex="-1"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Aplikace potřebuje zapnutý JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
