name: Ladění stahování exportů

on:
  workflow_dispatch:

jobs:
  hlavicky:
    runs-on: ubuntu-latest
    steps:
      - name: Hlavičky exportů do Excelu
        run: |
          for art in 8 2; do
            url="https://chess-results.com/tnr1507857.aspx?lan=5&zeilen=0&art=${art}&prt=4&excel=2010"
            echo "=== art=${art} ==="
            curl -sS -D - -o /tmp/f.xlsx -m 60 \
              -H "User-Agent: Mozilla/5.0 (Android 14; Mobile) AppleWebKit/537.36 Chrome/131 Safari/537.36" \
              "$url" | tr -d '\r' | grep -iE '^(HTTP/|content-type|content-disposition|content-length)' || true
            echo "  prvni bajty: $(head -c 2 /tmp/f.xlsx | xxd -p), velikost: $(wc -c < /tmp/f.xlsx) B"
            unzip -p /tmp/f.xlsx xl/sharedStrings.xml 2>/dev/null | grep -o 'Sestava družstva bez výsledků\|Los družstev pro všechna kola' | head -1 || echo "  (nelze zjistit obsah)"
          done
