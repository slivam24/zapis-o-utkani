name: Ladění rozlosování

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Vypsat strukturu stránky s losem
        run: |
          python - <<'PY'
          import requests, re
          from bs4 import BeautifulSoup
          s = requests.Session()
          s.headers.update({"User-Agent": "zapis-o-utkani/1.0 (ladeni)", "Accept-Language": "cs"})
          r = s.get("https://chess-results.com/tnr1508895.aspx", params={"lan": 5, "art": 2, "zeilen": 0}, timeout=45)
          r.raise_for_status()
          soup = BeautifulSoup(r.text, "html.parser")
          print("URL:", r.url)
          print("NADPISY:", [h.get_text(" ", strip=True) for h in soup.find_all(["h1","h2","h3"])][:10])
          rows = soup.find_all("tr")
          print("POCET TR:", len(rows))
          for i, tr in enumerate(rows[:40]):
              tds = tr.find_all(["td","th"], recursive=False)
              cells = [" ".join(td.get_text(" ").split()) for td in tds]
              print(f"TR{i:03d} n={len(cells)} cls={tr.get('class')} :: {cells!r}")
          print("--- bunky obsahujici 'kolo' ---")
          for el in soup.find_all(string=re.compile(r"kolo", re.I))[:20]:
              print(repr(" ".join(str(el).split()))[:200], "| rodic:", el.parent.name, el.parent.get("class"))
          PY
