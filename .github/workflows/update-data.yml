name: Aktualizace soupisek

# Spouští se sama každý pátek, ručně (záložka Actions, tlačítko Run workflow) a po přidání
# soutěže z hlášení. Soupisky se mění nejvýš jednou za dva týdny, páteční stažení stačí.
# Čas je v UTC: 15:23 UTC je 16:23 v zimě a 17:23 v létě. Minuta mimo celou hodinu je schválně,
# úlohy plánované na :00 GitHub často spouští se zpožděním.
on:
  schedule:
    - cron: "23 15 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Nové soutěže, které svaz zveřejnil až během sezóny (třeba Praha, která hraje v kalendářním roce).
      # Soutěže, které v aplikaci už jsou, nechá být; do souhrnu se vypíšou jen ty nové a problémy.
      - name: Přidat nové soutěže z chess.cz
        run: |
          {
            echo "## Nové soutěže z chess.cz"
            node scripts/import_chesscz.mjs --kraj vse | grep -v "už v aplikaci" || echo "Žádné nové."
          } >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Doplnit počet šachovnic, kde byl jen odhad
        run: node scripts/import_chesscz.mjs --recheck >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - run: node scripts/fetch_data.mjs --save-html raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stazene-stranky
          path: raw
          retention-days: 14
          if-no-files-found: ignore
      - name: Uložit změny
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data scripts/competitions.json
          if git diff --cached --quiet; then
            echo "Beze změn."
          else
            git commit -m "Aktualizace soupisek z chess.cz a chess-results"
            git pull --rebase --autostash
            git push
          fi
