name: Ověření načítání soutěží

# Vyzkouší, jestli aplikace na živém webu dokáže načíst soutěž z chess-results.
# Hodí se po nasazení vlastního prostředníka (worker/README.md): zadej jeho adresu
# do pole proxy a úloha řekne, jestli načtení projde.
#
# Pozor: úloha běží v datovém centru GitHubu a veřejné CORS služby takové adresy
# běžně blokují. Když tu selžou, ve vlastním prohlížeči ještě fungovat mohou.

on:
  workflow_dispatch:
    inputs:
      proxy:
        description: "Adresa prostředníka se zástupným {url}. Prázdné = výchozí veřejné služby."
        required: false
        default: ""
      tnr:
        description: "Odkaz na turnaj, na kterém se to zkusí."
        required: false
        default: "https://chess-results.com/tnr1246377.aspx?lan=5"

jobs:
  zkouska:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i -D playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Zkusit načtení v prohlížeči
        env:
          PROXY: ${{ inputs.proxy }}
          TNR: ${{ inputs.tnr }}
        run: |
          cat > zkouska.mjs <<'EOF'
          import { chromium } from 'playwright';
          const APP = 'https://slivam24.github.io/zapis-o-utkani/';
          const DEFAULTS = [
            'https://api.allorigins.win/raw?url={url}',
            'https://corsproxy.io/?url={url}',
            'https://api.codetabs.com/v1/proxy?quest={url}',
          ];
          const proxies = process.env.PROXY ? [process.env.PROXY] : DEFAULTS;
          const tnr = process.env.TNR;
          const browser = await chromium.launch();
          const results = [];
          for (const proxy of proxies) {
            const ctx = await browser.newContext();
            const page = await ctx.newPage();
            try {
              await page.goto(APP, { waitUntil: 'networkidle' });
              await page.evaluate((p) => {
                localStorage.setItem('zapis.proxies.v1', JSON.stringify([p]));
                localStorage.removeItem('zapis.comps.v1');
                localStorage.removeItem('zapis.draft.v1');
              }, proxy);
              await page.reload({ waitUntil: 'networkidle' });
              await page.click('button[data-act="toggleAdd"]');
              await page.fill('input[data-add="url"]', tnr);
              await page.click('button[data-act="loadComp"]');
              await page.waitForFunction(
                () => !document.querySelector('button[data-act="loadComp"]')?.disabled,
                { timeout: 180000 },
              );
              const ok = await page.$eval('.issues li.okmsg', (e) => e.textContent).catch(() => null);
              const err = await page.$eval('.issues li.error', (e) => e.textContent).catch(() => null);
              results.push({ proxy, stav: ok ? 'OK' : 'CHYBA', text: (ok ?? err ?? 'bez hlášky').slice(0, 200) });
            } catch (e) {
              results.push({ proxy, stav: 'VYPRSELO', text: e.message.slice(0, 120) });
            }
            await ctx.close();
          }
          await browser.close();
          for (const r of results) console.log(`VYSLEDEK ${r.stav.padEnd(9)} ${r.proxy}\n          ${r.text}`);
          const ok = results.filter((r) => r.stav === 'OK').length;
          console.log(`SHRNUTI funkčních: ${ok} z ${results.length}`);
          process.exit(ok ? 0 : 1);
          EOF
          node zkouska.mjs
